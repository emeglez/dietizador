<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Dietizador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: cabecera con selector de menú; columna principal = rejilla de días; columna lateral fija = lista de la compra por secciones */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --ink:#17251E; --muted:#5A6A61; --line:#DAE3DC;
  --accent:#1E6A4E; --accent-ink:#FFFFFF; --accent-soft:#E0EEE6;
  --citrus:#F2B33D; --citrus-soft:#FCF0D6; --citrus-ink:#6A4800;
  --berry:#B4436C; --berry-soft:#F7E3EA;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow:0 10px 30px rgba(20,40,30,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1613; --surface:#17211C; --ink:#E6EEE9; --muted:#9AADA2; --line:#2A3830;
  --accent:#62C99C; --accent-ink:#0C1A13; --accent-soft:#1D372B;
  --citrus:#E8AE3F; --citrus-soft:#3A2F17; --citrus-ink:#F4D28E;
  --berry:#E68BAB; --berry-soft:#3B2230; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#17211C; --ink:#E6EEE9; --muted:#9AADA2; --line:#2A3830;
  --accent:#62C99C; --accent-ink:#0C1A13; --accent-soft:#1D372B;
  --citrus:#E8AE3F; --citrus-soft:#3A2F17; --citrus-ink:#F4D28E;
  --berry:#E68BAB; --berry-soft:#3B2230; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:20px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.ttl{font-family:var(--display);font-weight:800;font-size:24px;margin:0}
#v-compra{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;gap:12px}
#v-compra .ttl{font-size:20px}
#v-compra .shop{columns:auto}
#v-compra .sec{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 0 0;margin:0 0 8px}
@media (min-width:1000px){
  .main,header{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:end}
  .picker{flex:none}
  .main{align-items:stretch}
  #v-compra{contain:size;overflow:hidden}
  #v-compra .shop{flex:1;min-height:0;overflow-y:auto;padding-right:6px;margin-right:-6px}
}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,40px);letter-spacing:-.02em;margin:0;line-height:1}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:6px 0 0;font-size:14px}

.picker{display:flex;flex-direction:column;gap:6px;min-width:0;flex:0 1 380px}
.picker label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prow{display:flex;gap:6px}
.sel{position:relative;flex:1;min-width:0}
.sel select{appearance:none;-webkit-appearance:none;width:100%;font:700 16px var(--body);color:var(--ink);background:var(--surface);
  border:1.5px solid var(--accent);border-radius:12px;padding:11px 40px 11px 14px;cursor:pointer}
.sel::after{content:"";position:absolute;right:15px;top:50%;width:8px;height:8px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.nav{width:44px;flex:none;font:700 18px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;cursor:pointer}
.nav:hover,.sel select:hover{border-color:var(--accent)}
.mdesc{margin:0;color:var(--muted);font-size:14px}

.summary{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-variant-numeric:tabular-nums}
.pill.c{background:var(--citrus-soft);color:var(--citrus-ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.day.today{border-color:var(--citrus);box-shadow:0 0 0 2px var(--citrus) inset}
.dayhead{display:flex;justify-content:space-between;align-items:baseline}
.dayhead h2{font-family:var(--display);font-weight:800;font-size:20px;margin:0}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--citrus);color:#3B2800;padding:3px 8px;border-radius:999px}
.slot{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;
  padding:9px 10px;border-radius:10px;background:var(--bg);border:1px solid transparent}
.slot:hover{border-color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;border-radius:6px;width:68px;text-align:center;display:inline-block}
.tag.desayuno{background:var(--citrus-soft);color:var(--citrus-ink)}
.tag.cena{background:var(--accent-soft);color:var(--accent)}
.tag.postre,.tag.picar{background:var(--berry-soft);color:var(--berry)}
.slot .nm{font-weight:600;font-size:14px;line-height:1.25;min-width:0}
.slot .meta{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.slot .arr{color:var(--muted);font-size:18px}
.off{font-size:13px;color:var(--muted);padding:9px 10px;border:1px dashed var(--line);border-radius:10px}
.slot:focus-visible,.chk:focus-within,.btn:focus-visible,.close:focus-visible,.nav:focus-visible,.sel select:focus-visible{outline:2px solid var(--citrus);outline-offset:2px}

.snacks{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.snacks h2,.sec h2{font-family:var(--display);font-weight:800;font-size:20px;margin:0}
.snacks p{margin:0;color:var(--muted);font-size:13px}
.snackgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}

.shopbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.prog{flex:1 1 220px;display:flex;align-items:center;gap:10px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 14px var(--body);padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.shop{columns:300px;column-gap:12px}
.sec{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px;display:flex;flex-direction:column;gap:4px}
.sec h2{font-size:17px;margin-bottom:4px}
.chk{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:7px 4px;border-radius:8px;cursor:pointer}
.chk input{width:20px;height:20px;margin:0;accent-color:var(--accent);cursor:pointer}
.chk .it{font-weight:600;font-size:14.5px}
.chk .why{display:block;font-size:12px;color:var(--muted);font-weight:500}
.chk .q{font-size:13px;color:var(--muted);font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chk.done .it,.chk.done .q{text-decoration:line-through;color:var(--muted)}
.chk .basic{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--citrus-ink);background:var(--citrus-soft);padding:1px 5px;border-radius:4px;margin-left:6px;vertical-align:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:30}

.ov{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;box-shadow:var(--shadow);
  padding:20px max(20px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:18px}}
.shead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.shead h3{font-family:var(--display);font-weight:800;font-size:24px;margin:6px 0 0;line-height:1.1;text-wrap:balance}
.close{border:0;background:var(--bg);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;flex:none}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fact{background:var(--bg);border-radius:10px;padding:8px 10px}
.fact b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.fact span{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.sheet h4{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ing{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ing li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.ing li span:last-child{color:var(--muted);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:14.5px}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;display:grid;place-items:center}
.note{background:var(--citrus-soft);color:var(--citrus-ink);border-radius:10px;padding:10px 12px;font-size:13.5px}
.foot{color:var(--muted);font-size:12.5px;max-width:70ch;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Dietiza<span>dor</span></h1>
    </div>
    <div class="picker">
      <label for="menu">Dieta</label>
      <div class="prow">
        <button class="nav" id="prev" aria-label="Dieta anterior">‹</button>
        <div class="sel"><select id="menu"></select></div>
        <button class="nav" id="next" aria-label="Dieta siguiente">›</button>
      </div>
    </div>
  </header>

  <div class="main">
    <section id="v-semana" class="col">
      <div class="grid" id="grid"></div>
      <div class="snacks">
        <div><h2>Para picar por la tarde</h2><p>Solo si hay hambre. Uno por persona. Iguales en todas las dietas.</p></div>
        <div class="snackgrid" id="snacks"></div>
      </div>
    </section>

    <aside id="v-compra" class="col">
      <h2 class="ttl">Lista de la compra</h2>
      <div class="shopbar">
        <div class="prog"><span id="pc">0 / 0</span><div class="bar"><i id="pb"></i></div></div>
        <div class="btns">
          <button class="btn pri" id="copy">Copiar lo que falta</button>
          <button class="btn" id="reset">Desmarcar todo</button>
        </div>
      </div>
      <div class="shop" id="shop"></div>
    </aside>
  </div>
</div>

<div class="ov" id="ov" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rt">
    <div class="shead">
      <div><span class="tag" id="rtag"></span><h3 id="rt"></h3></div>
      <button class="close" id="close" aria-label="Cerrar">×</button>
    </div>
    <div class="facts">
      <div class="fact"><b id="rmin"></b><span>minutos</span></div>
      <div class="fact"><b id="rprot"></b><span>proteína</span></div>
    </div>
    <div><h4 id="ringh">Ingredientes (para 2)</h4><ul class="ing" id="ring"></ul></div>
    <div><h4>Pasos</h4><ol class="steps" id="rsteps"></ol></div>
    <div class="note" id="rtip"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Productos (sección + unidad) ---------- */
const SEC={fr:"Frutería",cp:"Carne, pescado y charcutería",hl:"Huevos y lácteos",de:"Despensa",co:"Congelados"};
const I={
 espinacas:["Espinacas frescas","fr","g"],tomate:["Tomates","fr"],pepino:["Pepinos","fr"],cebolla_morada:["Cebolla morada","fr"],
 cebolla:["Cebollas","fr"],lechuga:["Lechuga / ensalada de bolsa","fr",["bolsa","bolsas"]],patata:["Patatas medianas","fr"],
 limon:["Limones","fr"],champi:["Champiñones laminados","fr","g"],platano:["Plátanos","fr"],manzana:["Manzanas","fr"],

 ajo:["Ajos","fr",["diente","dientes"]],aguacate:["Aguacates","fr"],esparragos:["Espárragos trigueros","fr",["manojo","manojos"]],kiwi:["Kiwis","fr"],
 pollo:["Filetes de pechuga de pollo","cp","g"],contramuslo:["Contramuslos de pollo deshuesados","cp","g"],
 pavo_lonchas:["Pechuga de pavo en lonchas","cp","g"],pavo_filete:["Filetes de pavo","cp","g"],pavo_picado:["Carne picada de pavo","cp","g"],
 atun:["Atún al natural","cp",["lata","latas"]],sardinas:["Sardinas en lata","cp",["lata","latas"]],jamon_cocido:["Jamón cocido extra","cp","g"],

 mozzarella:["Mozzarella light","hl",["bola","bolas"]],gelatina:["Gelatina 0 %","hl"],leche:["Leche semidesnatada","hl","ml"],

 queso_lonchas:["Queso en lonchas light","hl",["loncha","lonchas"]],feta:["Queso feta","hl","g"],parmesano:["Parmesano","hl","g"],
 crema_calabacin:["Crema de calabacín (brick)","de","ml"],crema_calabaza:["Crema de calabaza (brick)","de","ml"],
 crema_champi:["Crema de champiñones (brick)","de","ml"],crema_verduras:["Crema de verduras (brick)","de","ml"],

 garbanzos:["Garbanzos cocidos","de",["bote","botes"]],lentejas:["Lentejas cocidas","de",["bote","botes"]],alubias:["Alubias cocidas","de",["bote","botes"]],

 especias_fajitas:["Especias para fajitas","de",null,1],
 verduras_wok:["Verduras para wok","co",["bolsa","bolsas"]],merluza:["Lomos de merluza","co","g"],judias:["Judías verdes","co","g"],
 frutos_rojos:["Frutos rojos","co","g"],gambas:["Gambas peladas","co","g"],bacalao:["Lomos de bacalao","co","g"],
 espinacas_cong:["Espinacas","co","g"],guisantes:["Guisantes","co","g"]
};
const frac=q=>{const w=Math.floor(q),r=q-w;return r>0.01?(w?w:"")+"½":String(w);};
function fmt(k,q,ceil){
  const it=I[k],u=it[2];
  if(it[3]&&q==null)return "al gusto";
  if(u==="g")return q>=1000?(q/1000).toLocaleString("es-ES")+" kg":q+" g";
  if(u==="ml")return q>=1000?(q/1000).toLocaleString("es-ES")+" L":q+" ml";
  const v=ceil?Math.ceil(q):q,s=ceil?String(v):frac(v);
  if(!u)return s;
  return s+" "+(v>1?u[1]:u[0]);
}

/* ---------- Recetas (cantidades para 2) ---------- */
const R={
/* postres */
 p1:{n:"Yogur proteico con canela",t:"postre",min:1,prot:15,ing:[["yogur_prot",2],["canela",null]],pasos:["Espolvorea canela y listo."],tip:"Una pizca de edulcorante si os apetece más dulce."},

 p6:{n:"Kiwis",t:"postre",min:1,prot:2,ing:[["kiwi",4]],pasos:["Dos por persona, partidos por la mitad y a cucharadas."],tip:"Van bien para la digestión."},
 p7:{n:"Yogur proteico con frutos rojos",t:"postre",min:2,prot:15,ing:[["yogur_prot",2],["frutos_rojos",150]],pasos:["Descongela los frutos rojos 1 min en el micro.","Échalos sobre el yogur."],tip:"El jugo de los frutos rojos hace de sirope."},
/* para picar (por persona) */
 s1:{n:"Yogur proteico",t:"picar",pp:1,min:0,prot:15,ing:[["yogur_prot",1]],pasos:["Directo de la nevera."],tip:"La opción que más sacia."},
 s2:{n:"Fruta",t:"picar",pp:1,min:0,prot:1,ing:[["manzana",1]],pasos:["Una pieza: manzana, plátano o un par de mandarinas."],tip:"Mejor fruta entera que zumo: sacia más."},
 s3:{n:"Tortitas de arroz",t:"picar",pp:1,min:0,prot:2,ing:[["tortitas_arroz",3]],pasos:["Tal cual o con una loncha de pavo encima."],tip:"Crujientes y ligeras para picar."},

const $=id=>document.getElementById(id);

/* ---------- Semana ---------- */
function slot(id,kind){
  const r=R[id];const b=document.createElement("button");b.className="slot";b.type="button";
  b.innerHTML=`<span class="tag ${kind}">${LABEL[kind]}</span><span class="nm">${r.n}</span><span class="arr" aria-hidden="true">›</span>`;
  b.onclick=()=>openR(id);return b;
}
function dayCard(name,items){
  const c=document.createElement("article");c.className="day";
  c.innerHTML=`<div class="dayhead"><h2>${name}</h2></div>`;
  items.forEach(([id,k])=>c.append(slot(id,k)));
  return c;
}
function renderWeek(){
  const m=MENUS[mi],g=$("grid");g.innerHTML="";
  DAYS.forEach((d,i)=>g.append(dayCard(d,[[m.c[i],"cena"],[m.p[i],"postre"]])));
}
function renderSnacks(){const s=$("snacks");["s2","s1","s3"].forEach(id=>s.append(slot(id,"picar")));}

/* ---------- Receta ---------- */
function openR(id){
  const r=R[id];
  $("rtag").className="tag "+r.t;$("rtag").textContent=LABEL[r.t];$("rt").textContent=r.n;
  $("rmin").textContent=r.min||"0";$("rprot").textContent=r.prot+" g";
  $("ringh").textContent=r.pp?"Ingredientes (por persona)":"Ingredientes (para 2)";
  $("ring").innerHTML=r.ing.map(([k,q,txt])=>`<li><span>${I[k][0]}</span><span>${txt||fmt(k,q)}</span></li>`).join("");
  $("rsteps").innerHTML=r.pasos.map(p=>`<li><span>${p}</span></li>`).join("");
  $("rtip").textContent=r.tip;$("ov").hidden=false;$("close").focus();
}
function closeR(){$("ov").hidden=true;}
$("close").onclick=closeR;$("ov").onclick=e=>{if(e.target.id==="ov")closeR();};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeR();});

/* ---------- Compra (se calcula del menú) ---------- */
function buildList(){
  const m=MENUS[mi],acc={};
  const add=(k,q)=>{const a=acc[k]||(acc[k]={q:0});if(q!=null)a.q+=q;};
  m.c.forEach((id,i)=>{R[id].ing.forEach(([k,q])=>add(k,q));R[m.p[i]].ing.forEach(([k,q])=>add(k,q));});
  SNACK_STOCK.forEach(([k,q])=>add(k,q));
  add("pan_desayunos",null);add("embutidos_desayunos",null);
  const out={};Object.keys(SEC).forEach(s=>out[s]=[]);
  Object.entries(acc).forEach(([k,a])=>out[I[k][1]].push({k,q:a.q,basic:I[k][3]===1,free:I[k][3]===2}));
  Object.values(out).forEach(arr=>arr.sort((x,y)=>(y.free-x.free)||(x.basic-y.basic)||I[x.k][0].localeCompare(I[y.k][0],"es")));
  return out;
}
let LIST={};
function renderShop(){
  LIST=buildList();const s=$("shop"),m=MENUS[mi];s.innerHTML="";let total=0,done=0;
  Object.entries(LIST).forEach(([sec,items])=>{
    if(!items.length)return;
    const box=document.createElement("div");box.className="sec";box.innerHTML=`<h2>${SEC[sec]}</h2>`;
    items.forEach(it=>{
      const key=m.id+"|"+it.k,on=!!checked[key];total++;if(on)done++;
      const l=document.createElement("label");l.className="chk"+(on?" done":"");
      l.innerHTML=`<input type="checkbox" id="c-${m.id}-${it.k}" ${on?"checked":""}><span><span class="it">${I[it.k][0]}${it.basic?'<span class="basic">despensa</span>':""}</span></span><span class="q">${it.basic||it.free?"":fmt(it.k,it.q,true)}</span>`;
      l.querySelector("input").onchange=e=>{checked[key]=e.target.checked;store.set("dietizador-compra-v2",checked);renderShop();};
      box.append(l);
    });
    s.append(box);
  });
  $("pc").textContent=`${done} / ${total}`;$("pb").style.width=(total?done/total*100:0)+"%";
}
$("reset").onclick=()=>{const p=MENUS[mi].id+"|";Object.keys(checked).forEach(k=>{if(k.startsWith(p))delete checked[k];});store.set("dietizador-compra-v2",checked);renderShop();toast("Lista desmarcada");};
$("copy").onclick=()=>{
  const m=MENUS[mi];
  const txt="Compra · "+m.n+"\n\n"+Object.entries(LIST).map(([sec,items])=>{
    const f=items.filter(it=>!checked[m.id+"|"+it.k]);
    return f.length?SEC[sec].toUpperCase()+"\n"+f.map(it=>"- "+I[it.k][0]+(it.basic?" (revisar)":it.free?"":" ("+fmt(it.k,it.q,true)+")")).join("\n"):"";
  }).filter(Boolean).join("\n\n");
  try{navigator.clipboard.writeText(txt).then(()=>toast("Lista copiada"),()=>fallback(txt));}catch(e){fallback(txt);}
};
function fallback(t){const ta=document.createElement("textarea");ta.value=t;document.body.append(ta);ta.select();
  try{document.execCommand("copy");toast("Lista copiada");}catch(e){toast("No se pudo copiar");}ta.remove();}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1800);}

/* ---------- Selector de menú ---------- */
const sel=$("menu");
MENUS.forEach((m,i)=>{const o=document.createElement("option");o.value=i;o.textContent=m.n;sel.append(o);});
function setMenu(i){mi=(i+MENUS.length)%MENUS.length;sel.value=mi;store.set("dietizador-menu",MENUS[mi].id);renderWeek();renderShop();}
sel.onchange=()=>setMenu(+sel.value);
$("prev").onclick=()=>setMenu(mi-1);$("next").onclick=()=>setMenu(mi+1);
renderSnacks();setMenu(mi);
</script>
